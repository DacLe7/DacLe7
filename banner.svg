<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="200" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="70" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="215" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="45" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="190" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="75" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="215" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- glowing orbs -->
  <circle cx="140" cy="130" r="70" fill="#7c3aed" opacity="0.18" filter="url(#glow)">
    <animate attributeName="cx" values="140;170;140" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="140" r="80" fill="#38bdf8" opacity="0.14" filter="url(#glow)">
    <animate attributeName="cx" values="860;830;860" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="80" font-weight="800" fill="url(#txt)" filter="url(#glow)" letter-spacing="4">DacLe7</text>
  <text x="500" y="178" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="#c4b5fd" letter-spacing="3">&lt; I make games &amp; code stuff /&gt;</text>

  <line x1="380" y1="203" x2="620" y2="203" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <animate attributeName="x1" values="500;380;500" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="500;620;500" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>
